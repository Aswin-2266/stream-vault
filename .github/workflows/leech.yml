name: Cloud Torrent Leech
run-name: "⚡ Leech: ${{ github.event.client_payload.title || github.event.inputs.title || 'Torrent Leech' }}"

on:
  repository_dispatch:
    types: [leech_torrent]
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI or Torrent URL'
        required: true
      title:
        description: 'Movie Title'
        required: false
        default: 'Manual Leech'
      user_id:
        description: 'Telegram User ID to notify'
        required: false
        default: '0'
      chat_id:
        description: 'Telegram Chat ID to edit progress'
        required: false
        default: '0'
      message_id:
        description: 'Telegram Message ID to edit progress'
        required: false
        default: '0'

jobs:
  leech:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hydrogram tgcrypto cryptg motor certifi requests

      - name: Run Cloud Leech Worker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
        run: |
          python scripts/cloud_leech.py \
            --magnet "${{ github.event.client_payload.magnet || github.event.inputs.magnet }}" \
            --title "${{ github.event.client_payload.title || github.event.inputs.title }}" \
            --user_id "${{ github.event.client_payload.user_id || github.event.inputs.user_id }}" \
            --task_id "${{ github.event.client_payload.task_id || '' }}" \
            --chat_id "${{ github.event.client_payload.chat_id || github.event.inputs.chat_id || '' }}" \
            --message_id "${{ github.event.client_payload.message_id || github.event.inputs.message_id || '' }}" \
            --size "${{ github.event.client_payload.size || '' }}" \
            --seeds "${{ github.event.client_payload.seeds || '0' }}"
